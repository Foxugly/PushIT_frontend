<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>PushitFrontend</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <script>
    // Anti-FOUC: apply the persisted (or system) theme before Angular boots, so
    // there's no light→dark flash on load. ThemeService reconciles afterwards.
    (function () {
      try {
        var t = localStorage.getItem('theme');
        var dark = t === 'dark' || (!t && window.matchMedia('(prefers-color-scheme: dark)').matches);
        if (dark) document.documentElement.classList.add('dark-mode');
      } catch (e) {}
    })();
  </script>
  <!-- Cloudflare Turnstile (captcha on register). The widget is rendered
       explicitly from the register panel; this only loads the API. -->
  <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
</head>
<body>
  <app-root></app-root>
</body>
</html>
