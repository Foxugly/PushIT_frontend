<header class="site-header" [class.site-header--sticky]="sticky()" [style.--content-max]="maxWidth()">
  <div class="site-header__inner">
  <a routerLink="/" class="site-brand" aria-label="PushIT">
    <img class="site-brand__mark" src="pushit-logo.svg" alt="" aria-hidden="true" width="40" height="40" />
    <span class="site-brand__label">PushIT</span>
  </a>
  <nav class="site-nav" aria-label="Main navigation">
    <a routerLink="/" routerLinkActive="is-active" [routerLinkActiveOptions]="{ exact: true }">
      <i class="pi pi-home" aria-hidden="true"></i>
      {{ labels().home }}
    </a>
    @if (session.isAuthenticated()) {
      <a routerLink="/dashboard" routerLinkActive="is-active">
        <i class="pi pi-th-large" aria-hidden="true"></i>
        {{ labels().dashboard }}
      </a>
    }
    <a routerLink="/features" routerLinkActive="is-active">
      <i class="pi pi-bolt" aria-hidden="true"></i>
      {{ labels().features }}
    </a>
    <a routerLink="/donate" routerLinkActive="is-active" class="site-nav__accent">
      <i class="pi pi-heart" aria-hidden="true"></i>
      {{ labels().donate }}
    </a>
    <a routerLink="/about" routerLinkActive="is-active">
      <i class="pi pi-info-circle" aria-hidden="true"></i>
      {{ labels().about }}
    </a>
  </nav>

  <div class="header-actions">
    <button
      type="button"
      class="site-header__theme"
      [attr.aria-label]="theme.theme() === 'dark' ? 'Light mode' : 'Dark mode'"
      (click)="theme.toggle()"
    >
      <i class="pi" [class.pi-sun]="theme.theme() === 'dark'" [class.pi-moon]="theme.theme() !== 'dark'"></i>
    </button>
    <app-language-menu />


    @if (session.isAuthenticated()) {
      <p-menu #userMenu [model]="userMenuItems()" [popup]="true" appendTo="body" />
      <p-button
        [label]="displayUsername()"
        icon="pi pi-angle-down"
        iconPos="right"
        [text]="true"
        rounded="true"
        styleClass="site-header__account"
        (onClick)="userMenu.toggle($event)"
      />
    } @else {
      <a routerLink="/auth" pButton [label]="labels().login" rounded="true" class="login-link"></a>
    }
  </div>
  </div>
</header>
