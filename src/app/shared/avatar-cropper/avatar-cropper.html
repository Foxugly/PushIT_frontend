@if (!sourceFile()) {
  <p-fileupload
    mode="advanced"
    [customUpload]="true"
    [auto]="false"
    [showUploadButton]="false"
    [showCancelButton]="false"
    accept="image/*"
    [maxFileSize]="2000000"
    [chooseLabel]="labels().choose"
    (onSelect)="onSelect($event)"
  />
  <p class="console-muted avatar-cropper__hint">{{ labels().hint }}</p>
} @else {
  <div class="avatar-cropper" role="group" [attr.aria-label]="labels().cropHint">
    <!-- The cropper canvas itself is pan/zoom via mouse/touch only (ngx-image-cropper
         has no keyboard handles). Zoom is reachable with the +/- buttons below; for
         framing, the centred crop is a sensible default — documented via the hint
         and the accessible name so SR/keyboard users aren't left without context. -->
    <image-cropper
      class="avatar-cropper__canvas"
      [attr.aria-label]="labels().cropHint"
      [attr.aria-describedby]="cropHintId"
      [imageFile]="sourceFile()!"
      [maintainAspectRatio]="true"
      [aspectRatio]="1"
      [roundCropper]="true"
      [onlyScaleDown]="false"
      [transform]="transform()"
      [resizeToWidth]="256"
      format="png"
      output="blob"
      [imageQuality]="92"
      (cropperReady)="onReady()"
    />

    <div class="avatar-cropper__controls">
      <p-button
        icon="pi pi-search-minus"
        [rounded]="true"
        [text]="true"
        [ariaLabel]="labels().zoomOut"
        [pTooltip]="labels().zoomOut"
        tooltipPosition="top"
        [disabled]="pending() || scale() <= 1"
        (onClick)="zoomOut()"
      />
      <p-button
        icon="pi pi-search-plus"
        [rounded]="true"
        [text]="true"
        [ariaLabel]="labels().zoomIn"
        [pTooltip]="labels().zoomIn"
        tooltipPosition="top"
        [disabled]="pending() || scale() >= 3"
        (onClick)="zoomIn()"
      />
      <span class="avatar-cropper__hint" [id]="cropHintId">{{ labels().cropHint }}</span>
    </div>

    <div class="avatar-cropper__actions">
      <p-button
        [label]="labels().change"
        severity="secondary"
        [text]="true"
        [disabled]="pending()"
        (onClick)="changeImage()"
      />
      <p-button
        [label]="labels().apply"
        icon="pi pi-check"
        [loading]="pending()"
        [disabled]="!ready() || pending()"
        (onClick)="apply()"
      />
    </div>
  </div>
}
