<div class="app-layout">
  <p-toast position="top-right" />
  <a href="#main-content" class="skip-link">{{ skipLabel() }}</a>
  <app-topmenu
    [mode]="'authenticated'"
    [sticky]="true"
    [maxWidth]="'var(--content-max)'"
  />

  <main id="main-content" tabindex="-1" class="app-layout__main">
    <div class="console-shell__body" [class.console-shell__body--no-sidebar]="hideSidebar">
      @if (!hideSidebar) {
        <aside class="console-shell__sidebar">
          <app-console-navigation />
        </aside>
      }

      <div class="console-shell__main">
        @if (shell.error()) {
          <app-alert
            [message]="shell.error()!"
            tone="danger"
          />
          <p-button
            [label]="shellCopy().retry"
            icon="pi pi-refresh"
            [loading]="shell.loading()"
            (onClick)="shell.reload()"
            styleClass="console-shell__retry"
          />
        } @else if (shell.loading() && !shell.apps().length) {
          <section class="console-card">
            <p class="console-empty">{{ shellCopy().loading }}</p>
          </section>
        } @else {
          <router-outlet />
        }
      </div>
    </div>
  </main>

  <app-footer />
</div>
