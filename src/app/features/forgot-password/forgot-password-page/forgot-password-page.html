<form class="public-card public-card--compact public-form forgot-card" [formGroup]="form" (ngSubmit)="submit()">
  <h1>{{ copy().title }}</h1>

  <label for="forgot-email">
    <span>{{ copy().email }}</span>
    <input id="forgot-email" pInputText type="email" formControlName="email" autocomplete="email" class="public-input" />
  </label>

  @if (error()?.detail) {
    <app-alert [message]="error()! | apiError" tone="danger" (dismissed)="error.set(null)" />
  }

  @if (turnstile.enabled) {
    <div #turnstile class="forgot-turnstile"></div>
  }

  <div class="public-submit-row forgot-submit-row">
    <p-button type="submit" [label]="copy().submit" [loading]="pending()" [disabled]="pending()" />
  </div>

  @if (submitted()) {
    <app-alert [message]="copy().submitted" tone="success" (dismissed)="submitted.set(false)" />
  }

  <p class="secondary-link">
    {{ copy().registerPrompt }}
    <a routerLink="/register">{{ copy().registerLink }}</a>
  </p>
  <p class="secondary-link">
    <a routerLink="/auth">{{ copy().backToLogin }}</a>
  </p>
</form>
