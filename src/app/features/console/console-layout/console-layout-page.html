<div class="app-layout">
  <app-site-header
    [sticky]="true"
    [maxWidth]="'var(--content-max)'"
    [username]="shell.user()?.email || 'Console'"
  />

  <main class="app-layout__main">
    <div class="console-shell__body" [class.console-shell__body--no-sidebar]="hideSidebar">
      @if (!hideSidebar) {
        <aside class="console-shell__sidebar">
          <app-console-navigation />
        </aside>
      }

      <main class="console-shell__main">
        @if (shell.error()) {
          <app-alert
            [message]="shell.error()!"
            tone="danger"
          />
          <p-button
            label="Réessayer"
            icon="pi pi-refresh"
            [loading]="shell.loading()"
            (onClick)="shell.reload()"
            styleClass="console-shell__retry"
          />
        } @else if (shell.loading() && !shell.apps().length) {
          <section class="console-card">
            <p class="console-empty">Chargement de votre console...</p>
          </section>
        } @else {
          <router-outlet />
        }
      </main>
    </div>
  </main>

  <app-site-footer />
</div>
