<section class="console-page account-page">
  <app-page-header [title]="copy().title" />

  @if (banner(); as alert) {
    <app-alert [message]="bannerMessage()" [tone]="alert.tone" (dismissed)="banner.set(null)" />
  }

  <section class="console-card" data-testid="account-panel">
    <div class="console-card__header">
      <h3>{{ copy().accountTitle }}</h3>
    </div>

    <dl class="account-page__facts">
      <div class="account-page__fact">
        <dt>{{ copy().email }}</dt>
        <dd data-testid="account-email">{{ shell.user()?.email || copy().fallbackEmail }}</dd>
      </div>

      @if (shell.user()?.userkey; as userkey) {
        <div class="account-page__fact">
          <dt>{{ copy().userkey }}</dt>
          <dd class="account-page__userkey">
            <code data-testid="account-userkey">{{ userkey }}</code>
            <p-button
              type="button"
              icon="pi pi-copy"
              severity="secondary"
              [text]="true"
              [rounded]="true"
              [ariaLabel]="copy().copyUserkey"
              [pTooltip]="copy().copyUserkey"
              (onClick)="copyUserkey()"
            />
          </dd>
        </div>
      }
    </dl>

    <div class="console-form account-page__language">
      <label for="account-language">
        <span>{{ copy().language }}</span>
        <p-select
          inputId="account-language"
          appendTo="body"
          [formControl]="language"
          [options]="languagePreference.options"
          optionLabel="label"
          optionValue="value"
          (onChange)="saveLanguage($event.value)"
        />
      </label>
    </div>
  </section>

  <app-change-password-panel />

  <app-delete-account-panel />
</section>
