<main class="public-content home-content">
  <section class="public-card hero-card">
    <h1>{{ copy().title }}</h1>
    <p>{{ copy().description }}</p>

    <div class="hero__actions">
      @if (isAuthenticated()) {
        <p-button routerLink="/dashboard" icon="pi pi-th-large" [label]="copy().dashboard" />
      } @else {
        <p-button routerLink="/auth" icon="pi pi-sign-in" [label]="copy().login" />
        <p-button routerLink="/register" icon="pi pi-user-plus" [label]="copy().register" severity="secondary" />
      }
      <button class="hero__contact" type="button" (click)="contactClick()">
        <i class="pi pi-envelope" aria-hidden="true"></i>
        <span>{{ copy().contact }}</span>
      </button>
    </div>
  </section>
</main>
