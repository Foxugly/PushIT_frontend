<main class="public-content features-content">
  <section class="public-card backend-card">
    <div class="backend-head">
      <div>
        <span class="public-badge">{{ copy().badge }}</span>
        <h1>{{ copy().title }}</h1>
        <p>{{ copy().description }}</p>
      </div>
    </div>

    <div class="features-grid">
      @for (section of copy().sections; track section.title; let i = $index) {
        <article class="feature-card">
          <span class="feature-card__icon">
            <i class="pi {{ sectionIcons[i] }}" aria-hidden="true"></i>
          </span>
          <h2>{{ section.title }}</h2>
          <ul class="feature-points">
            @for (item of section.items; track item) {
              <li>{{ item }}</li>
            }
          </ul>
        </article>
      }
    </div>
  </section>
</main>
