# PushIT frontend (Angular SPA) — vhost nginx pour pushit.foxugly.com.
#
# Installé dans /etc/nginx/sites-available/ et symlinké dans sites-enabled/ par
# deploy/setup-server.sh.
#
# TLS : certificat WILDCARD *.foxugly.com (émis par DNS-01 via route53),
# référencé directement ci-dessous — PAS de `certbot --nginx` par sous-domaine.
#
# Pattern A : les valeurs de config runtime viennent de SSM via le snippet
# inclus plus bas (écrit par fetch-frontend-runtime-from-ssm.sh) et sont
# injectées dans index.html via sub_filter, puis lues par Angular (runtime-config.ts).
# Pas de proxy /api : le frontend appelle pushit-api.foxugly.com en cross-origin.

# HTTP -> HTTPS
server {
    listen 80;
    server_name pushit.foxugly.com;
    return 301 https://$host$request_uri;
}

server {
    # Forme `listen ... http2` (compatible nginx < 1.25.1) — cohérente avec les
    # autres vhosts foxugly.com sur cette box. La directive moderne `http2 on;`
    # n'existe qu'à partir de nginx 1.25.1.
    listen 443 ssl http2;
    server_name pushit.foxugly.com;

    ssl_certificate     /etc/letsencrypt/live/foxugly.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/foxugly.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/django_websites/PushIT_frontend/dist/pushit-frontend/browser;
    index index.html;

    client_max_body_size 5m;

    # En-têtes de sécurité (ré-émis dans les location qui posent leur propre
    # add_header — nginx n'hérite pas dès qu'un location déclare un add_header).
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Content-Type-Options    "nosniff" always;
    add_header X-Frame-Options           "SAMEORIGIN" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy        "geolocation=(), microphone=(), camera=()" always;

    # Défauts vides : la page reste valide même sans snippet (bootstrap avant
    # premier fetch). L'opérateur/fetch écrit le snippet qui surcharge ces `set`.
    set $pushit_api_base       "";
    set $pushit_sentry_dsn     "";
    set $pushit_sentry_env     "production";
    set $pushit_sentry_release "";
    set $pushit_features       "{}";
    set $pushit_csp_report     "";   # "; report-uri <sentry>" écrit par le fetch SSM
    include /etc/nginx/snippets/pushit-frontend-runtime*.conf;   # le glob tolère l'absence

    # Routing SPA : tout chemin inconnu retombe sur index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html jamais caché (référence des bundles hashés qui changent à chaque
    # deploy) + injection des globals runtime juste avant </head>.
    location = /index.html {
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
        add_header X-Content-Type-Options    "nosniff" always;
        add_header X-Frame-Options           "SAMEORIGIN" always;
        add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy        "geolocation=(), microphone=(), camera=()" always;
        add_header Cache-Control             "no-store, no-cache, must-revalidate" always;
        expires 0;

        # Content-Security-Policy — ENFORCED (fleet rollout, OPERATIONS §3.6 +
        # backlog #15; enforce 2026-06-12 after a clean Report-Only window via
        # report-uri Sentry). Rollback = rename back to
        # Content-Security-Policy-Report-Only and redeploy.
        # Nonce-based : le seul <script> inline est celui injecté par sub_filter
        # ci-dessous, qui porte nonce="$request_id" (même valeur que le header).
        # Build AOT => pas de script inline Angular. Turnstile est rendu de façon
        # programmatique (pas de handler on* inline), donc PAS de script-src-attr
        # 'unsafe-inline' (point d'escalade XSS inutile, retiré). connect/img :
        # propre API cross-subdomain + Sentry ingest ; style-src 'unsafe-inline' pour
        # les styles inline Angular ; frame/script-src : Cloudflare Turnstile.
        add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self' 'nonce-$request_id' https://challenges.cloudflare.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://pushit-api.foxugly.com; font-src 'self' data:; connect-src 'self' https://pushit-api.foxugly.com https://*.ingest.de.sentry.io; frame-src https://challenges.cloudflare.com; worker-src 'self' blob:$pushit_csp_report" always;

        # index.html est réécrit par sub_filter -> non pré-compressable.
        # Compression dynamique (fichier minuscule, coût négligeable).
        brotli on;
        gzip on;

        # $pushit_features injecté SANS guillemets -> littéral objet JS. Le <script>
        # porte nonce="$request_id" pour satisfaire script-src 'nonce-...' de la CSP.
        sub_filter '</head>' '<script nonce="$request_id">window.__PUSHIT_API_BASE_URL="$pushit_api_base";window.__PUSHIT_TURNSTILE_SITE_KEY="$pushit_turnstile_site_key";window.__PUSHIT_SENTRY_DSN="$pushit_sentry_dsn";window.__PUSHIT_SENTRY_ENV="$pushit_sentry_env";window.__PUSHIT_SENTRY_RELEASE="$pushit_sentry_release";window.__PUSHIT_FEATURES=$pushit_features;</script></head>';
        sub_filter_once on;
    }

    # Bundles hashés (chunk-XXXX.js, styles-XXXX.css, fonts…) : cache immutable.
    location ~* \.(?:js|css|woff2?|ttf|eot|svg|png|jpg|jpeg|gif|ico)$ {
        # Sert les .br/.gz pré-compressés au build (scripts/precompress.mjs),
        # zéro recompression à la volée. Si le .br/.gz n'existe pas (woff2,
        # images), nginx sert l'original. brotli_static ajoute Vary: Accept-Encoding.
        brotli_static on;
        gzip_static on;

        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
        add_header X-Content-Type-Options    "nosniff" always;
        add_header X-Frame-Options           "SAMEORIGIN" always;
        add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy        "geolocation=(), microphone=(), camera=()" always;
        add_header Cache-Control             "public, max-age=31536000, immutable" always;
        expires 1y;
        access_log off;
        try_files $uri =404;
    }

    access_log /var/log/nginx/pushit-frontend-access.log;
    error_log  /var/log/nginx/pushit-frontend-error.log;
}
