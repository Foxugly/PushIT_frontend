name: CI

# Valide les tests e2e (Playwright) sur les PRs, pour attraper les régressions
# UI (footer, layouts publics, parcours console…) AVANT le merge. Sur main, c'est
# le workflow de déploiement qui relance l'e2e en pré-requis du déploiement
# (gate) — voir deploy.yml. La suite e2e est entièrement mockée (page.route sur
# /api/v1/**), donc aucun backend n'est requis.

on:
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser (chromium)
        run: npx playwright install --with-deps chromium

      - name: Run e2e tests
        run: npm run test:e2e
