name: Deploy frontend to EC2

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-frontend
  cancel-in-progress: false

jobs:
  # Gate : tests unitaires + seuil de couverture.
  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Vitest (jsdom) + seuil de couverture (scripts/check-coverage.mjs).
      - name: Run unit tests with coverage threshold
        run: npm run test:ci

  # Gate : le déploiement n'a lieu que si l'e2e (Playwright, mocké) passe.
  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser (chromium)
        run: npx playwright install --with-deps chromium

      - name: Run e2e tests
        run: npm run test:e2e

  build-and-deploy:
    needs: [unit, e2e]
    runs-on: ubuntu-latest
    # OIDC → SSM + S3-bundle (no long-lived SSH key). Mirrors the fleet model
    # (trainingmanager_frontend / OPERATIONS.md §3.11): build in CI → upload the
    # bundle to S3 → SSM (root) installs the unit / fetch-script / nginx vhost
    # from the COMMITTED git blob, pulls the bundle from S3 via the instance
    # role, and atomic-swaps it into the docroot.
    environment: production
    permissions:
      id-token: write    # mint the OIDC token to assume the deploy role
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Le SHA est figé dans le bundle (src/app/core/build-info.ts) : la release
      # Sentry vaut pushit-frontend@<sha>, le nom sous lequel les source maps
      # sont uploadées ci-dessous. Il prime sur SENTRY_RELEASE (SSM).
      - name: Build (production)
        env:
          BUILD_SHA: ${{ github.sha }}
        run: npm run build -- --define "PUSHIT_BUILD_SHA='${BUILD_SHA}'"

      - name: Verify build output
        run: test -f dist/pushit-frontend/browser/index.html

      # Source maps « hidden » (angular.json : pas de commentaire
      # sourceMappingURL dans les .js). Envoyées à Sentry SEULEMENT si le secret
      # SENTRY_AUTH_TOKEN existe ; sinon étape sautée proprement. Un échec Sentry
      # ne bloque pas le déploiement (continue-on-error) : les .map sont de toute
      # façon retirées à l'étape suivante.
      - name: Upload source maps to Sentry (optional)
        continue-on-error: true
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_URL: https://de.sentry.io/
          SENTRY_ORG: foxugly-srl
          SENTRY_PROJECT: pushit-frontend
          RELEASE: pushit-frontend@${{ github.sha }}
        run: |
          if [ -z "$SENTRY_AUTH_TOKEN" ]; then
            echo "::notice::SENTRY_AUTH_TOKEN absent : upload des source maps sauté."
            exit 0
          fi
          DIR=dist/pushit-frontend/browser
          # Debug IDs dans les .js ET les .map (appariement sans dépendre des URLs).
          npx --no-install sentry-cli sourcemaps inject "$DIR"
          npx --no-install sentry-cli releases new "$RELEASE"
          npx --no-install sentry-cli sourcemaps upload --release "$RELEASE" --url-prefix '~/' "$DIR"
          npx --no-install sentry-cli releases finalize "$RELEASE"

      # Les .map ne quittent JAMAIS le runner : ni dans le tar S3, ni dans le
      # docroot (le vhost les refuse aussi, en défense en profondeur).
      - name: Strip source maps from the bundle
        run: |
          find dist/pushit-frontend/browser -name '*.map' -delete
          if find dist/pushit-frontend/browser -name '*.map' | grep -q .; then
            echo "::error::source maps still present in the bundle"; exit 1
          fi

      - name: Precompress assets (brotli + gzip)
        run: node scripts/precompress.mjs

      - name: Package bundle
        id: pkg
        run: |
          tar -czf frontend-build.tar.gz -C dist/pushit-frontend/browser .
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: eu-west-1
          role-session-name: gh-actions-${{ github.run_id }}

      - name: Upload bundle to S3
        # Namespaced under builds/pushit-frontend/ so the app can share the fleet
        # deploy bucket (foxugly-deploy) without colliding with other builds.
        run: |
          aws s3 cp frontend-build.tar.gz \
            "s3://${{ secrets.S3_DEPLOY_BUCKET }}/builds/pushit-frontend/${{ steps.pkg.outputs.sha }}.tar.gz"

      - name: Deploy on EC2 via SSM
        id: ssm
        env:
          INSTANCE_ID: ${{ secrets.EC2_INSTANCE_ID }}
          BUCKET: ${{ secrets.S3_DEPLOY_BUCKET }}
          SHA: ${{ steps.pkg.outputs.sha }}
        run: |
          # AWS-RunShellScript runs as ROOT. Steps: heal ownership; (django,
          # umask 027) git reset → refresh deploy artifacts; install unit / root
          # fetch-script / nginx vhost from the COMMITTED git blob (never the
          # django tree → §3.10); enable unit; pull the bundle from S3 via the
          # instance role (blank the certbot creds) and atomic-swap into the
          # docroot; restart the runtime-fetch unit (writes the SSM snippet); puis
          # RECHARGE nginx explicitement — le runtime-fetch saute son reload quand
          # le snippet SSM est inchange, donc un changement de VHOST n'etait jamais
          # applique : deploiement vert, fichier sur disque, nginx sur l'ancienne
          # conf. Constate le 2026-07-28. Normalise les perms.
          APP=/var/www/django_websites/PushIT_frontend
          DOC="$APP/dist/pushit-frontend/browser"
          # Root lit les blobs qu'il installe dans SON PROPRE miroir nu (root:root 700),
          # alimente depuis GitHub au SHA deploye — jamais dans le checkout django, dont
          # .git (refs, config, hooks) est reecrivable par django (escalade vers root).
          M=/var/lib/fleet-deploy/PushIT_frontend.git
          GB="git --git-dir=$M show $SHA"
          cat > /tmp/ssm-params.json <<EOF
          { "commands": [
            "chown -R django:www-data $APP",
            "sudo -u django bash -c 'umask 027; cd $APP && git fetch --quiet origin main && git reset --hard --quiet origin/main'",
            "install -d -m 700 -o root -g root /var/lib/fleet-deploy",
            "[ -d $M ] || git init --quiet --bare $M",
            "git --git-dir=$M fetch --quiet --depth=1 https://github.com/Foxugly/PushIT_frontend.git $SHA && git --git-dir=$M cat-file -e $SHA^{commit} || exit 1",
            "$GB:deploy/systemd/pushit-frontend-runtime-fetch.service > /etc/systemd/system/pushit-frontend-runtime-fetch.service",
            "$GB:deploy/fetch-frontend-runtime-from-ssm.sh > /usr/local/sbin/pushit-frontend-runtime-fetch.sh && chmod 0755 /usr/local/sbin/pushit-frontend-runtime-fetch.sh && chown root:root /usr/local/sbin/pushit-frontend-runtime-fetch.sh",
            "$GB:deploy/nginx/pushit-frontend.conf > /etc/nginx/sites-available/pushit-frontend.conf && ln -sf /etc/nginx/sites-available/pushit-frontend.conf /etc/nginx/sites-enabled/pushit-frontend.conf",
            "systemctl daemon-reload && systemctl enable --quiet pushit-frontend-runtime-fetch",
            "env AWS_SHARED_CREDENTIALS_FILE=/dev/null AWS_CONFIG_FILE=/dev/null aws s3 cp s3://$BUCKET/builds/pushit-frontend/$SHA.tar.gz /tmp/pfe.tar.gz --region eu-west-1",
            "rm -rf /tmp/pfe && mkdir -p /tmp/pfe && tar -xzf /tmp/pfe.tar.gz -C /tmp/pfe",
            "rm -rf $APP/dist/.bundle-prev; [ -d $APP/dist/.bundle-current ] && mv $APP/dist/.bundle-current $APP/dist/.bundle-prev || true",
            "rm -rf $APP/dist/.bundle-current && cp -a /tmp/pfe $APP/dist/.bundle-current",
            "mkdir -p $DOC && rsync -a --delete $APP/dist/.bundle-current/ $DOC/",
            "[ -d $APP/dist/.bundle-prev ] && rsync -a --ignore-existing $APP/dist/.bundle-prev/ $DOC/ || true",
            "rm -rf /tmp/pfe /tmp/pfe.tar.gz",
            "systemctl restart pushit-frontend-runtime-fetch",
            "nginx -t && systemctl reload nginx",
            "chown -R django:www-data $APP && chmod -R g-w,o-rwx $APP"
          ], "executionTimeout": ["900"] }
          EOF
          CMD_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "Deploy pushit-frontend ${{ github.sha }}" \
            --cloud-watch-output-config CloudWatchOutputEnabled=true \
            --parameters file:///tmp/ssm-params.json \
            --query Command.CommandId --output text)
          echo "cmd_id=$CMD_ID" >> "$GITHUB_OUTPUT"

      - name: Wait for SSM command
        env:
          INSTANCE_ID: ${{ secrets.EC2_INSTANCE_ID }}
          CMD_ID: ${{ steps.ssm.outputs.cmd_id }}
        run: |
          for _ in $(seq 1 180); do
            STATUS=$(aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" --query Status --output text 2>/dev/null || echo Pending)
            case "$STATUS" in
              Success) aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" --query StandardOutputContent --output text; exit 0 ;;
              Failed|Cancelled|TimedOut)
                echo "Deploy $STATUS"
                aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" --query StandardErrorContent --output text
                exit 1 ;;
              *) sleep 5 ;;
            esac
          done
          echo "Timed out"; exit 1

      - name: Smoke test
        run: |
          for attempt in 1 2 3; do
            if curl --fail --silent --show-error --max-time 30 -I https://pushit.foxugly.com > /dev/null; then
              echo "Deployment OK (attempt $attempt)"
              exit 0
            fi
            echo "Smoke test attempt $attempt failed, retrying in 5s..."
            sleep 5
          done
          echo "Smoke test failed after 3 attempts"
          exit 1
