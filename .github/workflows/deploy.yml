name: Deploy frontend to EC2

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-frontend
  cancel-in-progress: false

jobs:
  # Gate : le déploiement n'a lieu que si l'e2e (Playwright, mocké) passe.
  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser (chromium)
        run: npx playwright install --with-deps chromium

      - name: Run e2e tests
        run: npm run test:e2e

  build-and-deploy:
    needs: e2e
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build (production)
        run: npm run build

      - name: Verify build output
        run: test -f dist/pushit-frontend/browser/index.html

      - name: Precompress assets (brotli + gzip)
        run: node scripts/precompress.mjs

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.EC2_SSH_KEY }}

      - name: Add EC2 host to known_hosts
        run: |
          ssh-keyscan -H "${{ secrets.EC2_HOST }}" | tee -a ~/.ssh/known_hosts | grep -q .

      - name: Rsync build to staging
        run: |
          rsync -az --delete \
            dist/pushit-frontend/browser/ \
            "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:/tmp/pushit-frontend-staging/"

      - name: Promote staging to live
        run: |
          # EC2_USER doit être `django` (plus `ubuntu`). deploy.sh tourne en
          # django SANS sudo ; il sudo en interne UNE seule commande précise
          # (restart de l'unité de fetch). Voir deploy/sudoers/pushit-frontend-deploy.
          ssh "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}" \
            '/var/www/django_websites/PushIT_frontend/deploy/deploy.sh'

      - name: Smoke test
        run: |
          for attempt in 1 2 3; do
            if curl --fail --silent --show-error --max-time 30 -I https://pushit.foxugly.com > /dev/null; then
              echo "Deployment OK (attempt $attempt)"
              exit 0
            fi
            echo "Smoke test attempt $attempt failed, retrying in 5s..."
            sleep 5
          done
          echo "Smoke test failed after 3 attempts"
          exit 1
